[package]
name = "gate-agent"
version = "0.0.9"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[lib]
name = "gate_agent"
path = "src/lib.rs"

[[bin]]
name = "gate-agent"
path = "src/main.rs"

[dependencies]
age = { version = "=0.11.5", features = ["armor"] }
axum = { version = "=0.8.9", features = ["macros"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
dirs = "=6.0.0"
futures-util = "=0.3.34"
http = "=1.5.0"
http-body-util = "=0.1.5"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "linux-native"] }
libc = "=0.2.189"
rand = "=0.9.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "=7.5.4"
secrecy = { version = "=0.10.3", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tempfile = "=3.27.0"
time = { version = "=0.3.47", features = ["formatting", "parsing", "serde"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.8.23"
toml_edit = "=0.22.27"
tower = { version = "=0.5.3", features = ["timeout", "util"] }
tower-http = { version = "=0.6.11", features = ["catch-panic", "request-id", "timeout", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
url = "=2.5.8"
dialoguer = "=0.11.0"

[dev-dependencies]
assert_cmd = "=2.2.2"
wiremock = "=0.6.5"
